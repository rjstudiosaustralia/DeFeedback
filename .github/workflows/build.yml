name: macOS build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify Apple Silicon binary
        run: lipo -archs "build/DeFeedbackLive_artefacts/Release/DeFeedback Live.app/Contents/MacOS/DeFeedback Live" | grep -qx arm64

      - name: Verify macOS 13 deployment target
        run: vtool -show-build "build/DeFeedbackLive_artefacts/Release/DeFeedback Live.app/Contents/MacOS/DeFeedback Live" | grep -Eq 'minos[[:space:]]+13\.0$'

      - name: Package ad-hoc-signed engineering build
        run: ./scripts/package-adhoc.sh Release build

      - uses: actions/upload-artifact@v6
        with:
          name: DeFeedback-Live-adhoc-arm64
          path: dist/DeFeedback-Live-*-adhoc-arm64.zip
          if-no-files-found: error

  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-module
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: companion-module/pnpm-lock.yaml

      - name: Install Companion module dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Companion module for validation
        run: pnpm run build

      - name: Lint Companion module
        run: pnpm run lint

      - name: Test Companion module authentication and commands
        run: pnpm run test

      - name: Build and package Companion module
        run: pnpm run package

      - uses: actions/upload-artifact@v6
        with:
          name: DeFeedback-Live-Companion-module
          path: companion-module/rjstudiosaustralia-defeedback-live-*.tgz
          if-no-files-found: error
